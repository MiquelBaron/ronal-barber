# Development stack — hot reload, seed users, PostgreSQL on localhost:5432
services:
  postgres:
    image: postgres:16-alpine
    container_name: ronal-barber-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-barbershop}
      POSTGRES_USER: ${POSTGRES_USER:-barber}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ronal-barber-backend-dev
    restart: unless-stopped
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-barber}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-barbershop}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-development}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@ronalbarber.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      BARBER_DEFAULT_PASSWORD: ${BARBER_DEFAULT_PASSWORD:-barber1}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@ronalbarber.com}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-ronalbarber_bot}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:-}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      REMINDER_SEND_HOUR: ${REMINDER_SEND_HOUR:-21}
      REMINDER_TIMEZONE: ${REMINDER_TIMEZONE:-Europe/Madrid}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - barber_uploads_dev:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ronal-barber-frontend-dev
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    volumes:
      - ./frontend:/app
      - frontend_node_modules_dev:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data_dev:
  frontend_node_modules_dev:
  barber_uploads_dev:
