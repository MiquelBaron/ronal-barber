<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="margin:24px 0;background-color:#f5f4f0;border:1px solid rgba(0,0,0,0.06);">
  {% for label, value in details %}
  <tr>
    <td style="padding:12px 16px;border-bottom:1px solid rgba(0,0,0,0.05);font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:#888888;width:38%;vertical-align:top;">
      {{ label }}
    </td>
    <td style="padding:12px 16px;border-bottom:1px solid rgba(0,0,0,0.05);font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#111111;vertical-align:top;">
      {{ value }}
    </td>
  </tr>
  {% endfor %}
</table>
