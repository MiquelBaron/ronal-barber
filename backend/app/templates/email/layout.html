<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>{% block title %}{{ shop_name }}{% endblock %}</title>
</head>
<body style="margin:0;padding:0;background-color:#eceae4;color:#111111;-webkit-text-size-adjust:100%;-ms-text-size-adjust:100%;">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">
    {% block preheader %}{% endblock %}
  </div>
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#eceae4;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:560px;background-color:#ffffff;border:1px solid rgba(0,0,0,0.08);">
          <!-- Header -->
          <tr>
            <td style="background-color:#0a0a0a;padding:28px 32px 24px;">
              <p style="margin:0 0 8px;font-family:Arial,Helvetica,sans-serif;font-size:10px;letter-spacing:0.28em;text-transform:uppercase;color:#c9a962;">
                {{ shop_name }}
              </p>
              <h1 style="margin:0;font-family:Georgia,'Times New Roman',serif;font-size:28px;line-height:1.1;font-weight:400;text-transform:uppercase;color:#f5f2ea;letter-spacing:0.02em;">
                {% block heading %}Mensaje{% endblock %}
              </h1>
            </td>
          </tr>
          <!-- Body -->
          <tr>
            <td style="padding:32px;font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.65;color:#333333;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <!-- Footer -->
          <tr>
            <td style="padding:24px 32px 32px;border-top:1px solid rgba(0,0,0,0.08);background-color:#faf9f7;text-align:center;">
              {% if logo_cid %}
              <img src="cid:{{ logo_cid }}" alt="{{ shop_name }}" width="120" style="display:block;margin:0 auto 16px;max-width:120px;height:auto;border:0;">
              {% endif %}
              <p style="margin:0 0 6px;font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:0.16em;text-transform:uppercase;color:#888888;">
                {{ shop_name }}
              </p>
              <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#aaaaaa;">
                Barbería premium · Reserva online
              </p>
            </td>
          </tr>
        </table>
        <p style="margin:16px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:11px;color:#999999;text-align:center;">
          Este correo se ha enviado automáticamente. Por favor, no respondas a este mensaje.
        </p>
      </td>
    </tr>
  </table>
</body>
</html>
